# This workflow will build an R Markdown file and publish it to GitHub Pages.
name: Deploy R Markdown Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc git libcurl4-gnutls-dev libssl-dev libxml2-dev
        
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.0' # Adjust this to your required R version

      - name: Install R packages
        run: |
          install.packages(c("rmarkdown", "knitr", "remotes"))
          remotes::install_github("inbo/INBOmd")
        shell: Rscript {0}

      - name: Render R Markdown file
        run: |
          rmarkdown::render("index.Rmd")
        shell: Rscript {0}
      
      - name: Copy rendered file to public directory
        run: |
          mkdir docs
          mv "index.html" docs/index.html

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
